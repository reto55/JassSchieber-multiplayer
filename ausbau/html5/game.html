<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schieber</title>
  <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>
<div id="auth-strip" style="position:fixed;top:0;left:0;right:0;background:#222;color:#eee;
                            padding:.4rem 1rem;display:flex;justify-content:space-between;
                            font:14px system-ui;z-index:1000">
  <span>Schieber</span>
  <span id="auth-info">…</span>
</div>
<div style="height:2.2rem"></div>
<div id="game">

  <!-- ① AI Bar -->
  <div id="ai-bar">
    <div class="ai-player" id="player-compe">
      <div class="ai-avatar">W</div>
      <div class="ai-info">
        <div class="ai-name">West</div>
        <div class="ai-cards" id="cards-compe"></div>
      </div>
    </div>
    <div class="ai-player partner" id="player-compn">
      <div class="ai-avatar">N</div>
      <div class="ai-info">
        <div class="ai-name">Nord ★</div>
        <div class="ai-cards" id="cards-compn"></div>
      </div>
    </div>
    <div class="ai-player" id="player-compo">
      <div class="ai-avatar">O</div>
      <div class="ai-info">
        <div class="ai-name">Ost</div>
        <div class="ai-cards" id="cards-compo"></div>
      </div>
    </div>
    <div class="ai-player" id="player-comps">
      <div class="ai-avatar">S</div>
      <div class="ai-info">
        <div class="ai-name">Süd</div>
        <div class="ai-cards" id="cards-comps"></div>
      </div>
    </div>
    <div id="score-panel">
      <div class="score-label">PUNKTE</div>
      <div class="score-row">
        <div class="score-team">
          <span class="team-label sn-label">SN</span>
          <span class="team-score" id="score-sn">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-team">
          <span class="team-label ow-label">OW</span>
          <span class="team-score" id="score-ow">0</span>
        </div>
      </div>
      <div class="score-target" id="score-target">Ziel: 1000</div>
    </div>
  </div>

  <!-- ② Table -->
  <div id="table">
    <div id="trump-badge" class="hidden">
      <span class="trump-label">Trumpf</span>
      <span id="trump-value"></span>
    </div>
    <div id="round-info">
      <span id="active-player"></span>
    </div>

    <!-- ③ Trick area — slot ids are historic (comps/compn/etc.) but
         the .trick-label text is repainted by JS at runtime according
         to the local seat's POV (`computeLayout`). The spatial layout
         (top / left / centre / right) maps to layout roles
         (top / left / bottom / right) regardless of which position
         the local seat is. -->
    <div id="trick-area">
      <div class="trick-slot" id="trick-compn">
        <span class="trick-label">Top</span>
      </div>
      <div id="trick-middle-row">
        <div class="trick-slot" id="trick-compe">
          <span class="trick-label">Left</span>
        </div>
        <div class="trick-slot" id="trick-comps">
          <span class="trick-label">Du</span>
        </div>
        <div class="trick-slot" id="trick-compo">
          <span class="trick-label">Right</span>
        </div>
      </div>
    </div>

    <!-- ④ Game log -->
    <div id="game-log">
      <div id="log-entries"></div>
    </div>
  </div>

  <!-- ⑤ Human hand -->
  <div id="hand-area">
    <div id="hand-label">Deine Hand</div>
    <div id="hand-cards"></div>
  </div>

</div>

<!-- Trump modal -->
<div id="trump-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <h3>Trumpf wählen</h3>
    <div id="trump-options" class="suit-grid"></div>
    <button id="schieben-btn" class="hidden schieben-btn">↩ Schieben</button>
  </div>
</div>

<!-- Weis modal -->
<div id="weis-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <h3>Weis ansagen?</h3>
    <div id="weis-list"></div>
    <div class="modal-actions">
      <button id="weis-announce-btn" class="btn-primary">✓ Ansagen</button>
      <button id="weis-pass-btn" class="btn-secondary">Schweigen</button>
    </div>
  </div>
</div>

<!-- Game Over modal -->
<div id="game-over-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <h3 id="game-over-title">🏆 Spiel vorbei!</h3>
    <p id="game-over-message"></p>
    <div class="modal-actions" style="flex-direction: column; gap: 10px;">
      <button id="btn-new-game" class="btn-primary">Start a new game</button>
      <button id="btn-home" class="btn-secondary">Go back to Home</button>
      <button id="btn-quit" class="btn-secondary" style="background: #cc4444; color: white;">Quit</button>
    </div>
  </div>
</div>

<script src="/static/js/schieber.js"></script>
</body>
</html>
