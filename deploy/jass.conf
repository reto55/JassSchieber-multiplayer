<VirtualHost *:80>
    ServerName platzanu.ch
    ServerAlias www.platzanu.ch
    ServerAdmin webmaster@localhost

    # Enable logging
    ErrorLog ${APACHE_LOG_DIR}/jass_error.log
    CustomLog ${APACHE_LOG_DIR}/jass_access.log combined

    # Proxy Configuration
    ProxyPreserveHost On
    ProxyRequests Off

    # Important: Route WebSockets FIRST
    # We match /ws/ and upgrade the connection to ws://
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/?(.*) "ws://127.0.0.1:8000/ws/$1" [P,L]

    # Route all other HTTP traffic to the Uvicorn application
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Optional: If you want Apache to serve static files directly for better performance,
    # you can uncomment the following lines. Otherwise, Uvicorn/FastAPI will handle them.
    # Alias /static /home/reto/Dokumente/JassSchieber-multiplayer/ausbau/html5
    # <Directory /home/reto/Dokumente/JassSchieber-multiplayer/ausbau/html5>
    #     Require all granted
    # </Directory>
    # ProxyPass /static !
</VirtualHost>
