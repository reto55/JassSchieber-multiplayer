server {
    listen 80;
    server_name platzanu.ch www.platzanu.ch;

    # Logging (Make sure the directory exists and Nginx has permissions)
    access_log /var/log/nginx/jass_access.log;
    error_log /var/log/nginx/jass_error.log;

    # Optional: Serve static files directly via Nginx for better performance
    # Uncomment the lines below if you want Nginx to handle static assets instead of FastAPI.
    # location /static/ {
    #     alias /home/reto/Dokumente/JassSchieber-multiplayer/ausbau/html5/;
    # }

    # Route WebSockets FIRST
    # We match /ws/ and upgrade the connection for WebSockets
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        
        # Required for WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optional: increase timeout for long-lived websocket connections
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Route all other HTTP traffic to the Uvicorn application
    location / {
        proxy_pass http://127.0.0.1:8000/;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
